<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅のしおり</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap');
</style>
<style>
#lock-screen{position:fixed;inset:0;background:var(--brown);z-index:9999;display:flex;align-items:center;justify-content:center;}
.lock-box{background:var(--cream);border-radius:16px;padding:2rem 1.8rem;width:min(320px,90vw);text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.lock-icon{font-size:2.2rem;margin-bottom:0.5rem;}
.lock-title{font-family:'Noto Serif JP',serif;font-size:1.2rem;font-weight:600;color:var(--brown-dark);margin-bottom:0.3rem;}
.lock-sub{font-size:0.78rem;color:var(--gray);margin-bottom:1.2rem;}
.lock-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem;font-size:1rem;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:white;outline:none;text-align:center;letter-spacing:0.15em;}
.lock-input:focus{border-color:var(--orange);}
.lock-btn{margin-top:0.8rem;width:100%;background:var(--brown);color:var(--cream);border:none;border-radius:8px;padding:0.65rem;font-size:0.9rem;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.lock-btn:hover{background:var(--brown-dark);}
.lock-btn:disabled{background:#bbb;cursor:not-allowed;}
.lock-error{font-size:0.78rem;color:var(--terra);margin-top:0.6rem;min-height:1.2em;}
.lock-attempts{font-size:0.73rem;color:var(--gray);margin-top:0.4rem;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<style>
:root{
  --cream:#fdf6e3;--cream2:#f5e9c8;--brown:#7a4810;--brown-light:#b07840;
  --brown-dark:#4a2800;--terra:#b04010;--green:#4a7040;--green-light:#e8f0e0;
  --orange:#e07820;--gray:#888;--text:#2a1800;--border:#d4b880;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cream);color:var(--text);font-size:14px;line-height:1.7;}

.cover{background:var(--brown);color:var(--cream);padding:2rem 2rem 1.8rem;text-align:center;position:relative;overflow:hidden;}
.cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,0.03) 20px,rgba(255,255,255,0.03) 40px);}
.cover-inner{position:relative;z-index:1;}
.cover-icon{font-size:2.2rem;margin-bottom:0.4rem;}
.cover h1{font-family:'Noto Serif JP',serif;font-size:1.7rem;font-weight:600;letter-spacing:0.1em;margin-bottom:0.2rem;}
.cover-sub{font-size:0.88rem;opacity:0.8;margin-bottom:0.8rem;}
.cover-meta{display:flex;justify-content:center;gap:1.2rem;font-size:0.8rem;opacity:0.9;flex-wrap:wrap;}

.nav-tabs{display:flex;background:var(--brown-dark);overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex:1;min-width:72px;padding:0.65rem 0.4rem;background:none;border:none;color:rgba(255,255,255,0.6);font-family:'Noto Sans JP',sans-serif;font-size:0.75rem;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;}
.tab-btn.active{color:var(--cream);border-bottom-color:var(--orange);}
.tab-btn:hover{color:var(--cream);}

.section{display:none;padding:1rem;}
.section.active{display:block;}

.card{background:white;border:1px solid var(--border);border-radius:10px;padding:0.9rem 1rem;margin-bottom:0.8rem;}
.card-title{font-size:0.8rem;font-weight:700;color:var(--brown);letter-spacing:0.06em;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.4rem;}

/* TOP BAR */
.top-bar{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.8rem;flex-wrap:wrap;}
.top-bar-left{display:flex;gap:0.5rem;flex:1;}
.print-btn{display:flex;align-items:center;gap:0.4rem;background:var(--brown);color:var(--cream);border:none;border-radius:20px;padding:0.38rem 0.9rem;font-size:0.76rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
.print-btn:hover{background:var(--brown-dark);}
.edit-toggle{display:flex;align-items:center;gap:0.4rem;background:var(--cream2);border:1px solid var(--border);border-radius:20px;padding:0.38rem 0.9rem;font-size:0.76rem;cursor:pointer;color:var(--brown);font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
.edit-toggle.on{background:var(--orange);color:white;border-color:var(--orange);}
.edit-hint{font-size:0.72rem;color:var(--orange);background:#fff8ee;border:1px dashed var(--orange);border-radius:6px;padding:0.28rem 0.6rem;margin-bottom:0.7rem;display:none;}
.edit-hint.show{display:block;}

/* DAY */
.day-header{display:flex;align-items:center;gap:0.7rem;margin:0.9rem 0 0.6rem;}
.day-badge{background:var(--brown);color:var(--cream);border-radius:20px;padding:0.22rem 0.8rem;font-size:0.76rem;font-weight:700;white-space:nowrap;}
.day-badge.d2{background:var(--terra);}
.day-badge.d3{background:var(--green);}
.day-line{flex:1;height:1px;background:var(--border);}

/* TIMELINE */
.timeline{position:relative;padding-left:1.3rem;}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:0.85rem;}
.tl-dot{position:absolute;left:-1.3rem;top:5px;width:11px;height:11px;border-radius:50%;background:var(--brown-light);border:2px solid white;box-shadow:0 0 0 1px var(--border);}
.tl-dot.main{background:var(--terra);width:13px;height:13px;top:4px;left:-1.35rem;}
.tl-dot.sub{background:var(--gray);}
.tl-time{font-size:0.73rem;color:var(--gray);font-weight:500;}
.tl-title{font-size:0.88rem;font-weight:700;color:var(--text);}
.tl-desc{font-size:0.78rem;color:#555;margin-top:0.05rem;}
.tl-note{font-size:0.74rem;color:var(--terra);background:#fff5f0;border-left:2px solid var(--terra);padding:0.2rem 0.5rem;margin-top:0.25rem;border-radius:0 4px 4px 0;}
.tl-info{font-size:0.74rem;color:var(--green);background:var(--green-light);border-left:2px solid var(--green);padding:0.2rem 0.5rem;margin-top:0.25rem;border-radius:0 4px 4px 0;}
.transport{display:inline-flex;align-items:center;gap:0.3rem;font-size:0.7rem;background:var(--cream2);border:1px solid var(--border);border-radius:20px;padding:0.08rem 0.55rem;margin:0.2rem 0;color:var(--brown);}
.star{color:var(--orange);}

/* EDIT COMMON */
[contenteditable="true"]{cursor:text;border-bottom:1px dashed var(--border);outline:none;min-width:30px;display:inline-block;}
h1[contenteditable="true"],h2[contenteditable="true"]{display:block;}
[contenteditable="true"]:focus{background:#fffbe8;border-bottom:2px solid var(--orange);}
.cover [contenteditable="true"]:focus{background:rgba(255,255,255,0.2);color:var(--cream);border-bottom-color:var(--cream);}
.del-btn{position:absolute;right:-0.3rem;top:1px;background:none;border:none;color:#ddd;cursor:pointer;font-size:0.82rem;display:none;}
.editing .del-btn{display:block;}
.del-btn:hover{color:var(--terra);}
.add-btn{display:flex;align-items:center;gap:0.4rem;background:none;border:1px dashed var(--border);border-radius:8px;padding:0.35rem 0.7rem;font-size:0.76rem;color:var(--brown-light);cursor:pointer;font-family:'Noto Sans JP',sans-serif;width:100%;justify-content:center;margin-top:0.2rem;display:none;}
.editing-active .add-btn{display:flex;}
.add-btn:hover{background:var(--cream2);}

/* HOTEL EDIT */
.hotel-card{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:0.8rem;}
.hotel-header{background:var(--brown);color:var(--cream);padding:0.55rem 1rem;font-size:0.8rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.hotel-body{padding:0.85rem 1rem;}
.info-row{display:flex;gap:0.5rem;margin-bottom:0.38rem;font-size:0.8rem;align-items:flex-start;position:relative;}
.info-label{color:var(--brown-light);font-weight:700;white-space:nowrap;min-width:65px;font-size:0.75rem;}
.info-val{flex:1;}
.info-row .del-btn{position:static;margin-left:auto;}

/* CHECKLIST EDIT */
.check-group{margin-bottom:0.75rem;}
.check-group-title{font-size:0.76rem;font-weight:700;color:var(--brown);margin-bottom:0.35rem;display:flex;align-items:center;gap:0.4rem;position:relative;}
.check-item{display:flex;align-items:center;gap:0.5rem;padding:0.28rem 0;border-bottom:1px dashed #eee;font-size:0.8rem;position:relative;}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{accent-color:var(--brown);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.check-item.checked label{text-decoration:line-through;color:var(--gray);}
.check-item label{flex:1;cursor:pointer;}
.check-item .del-btn{position:static;}

/* CONTACT EDIT */
.emg-item{display:flex;justify-content:space-between;align-items:center;padding:0.45rem 0;border-bottom:1px dashed #eee;font-size:0.8rem;gap:0.5rem;position:relative;}
.emg-item:last-child{border-bottom:none;}
.emg-label-s{color:var(--gray);font-size:0.73rem;}
.emg-val{font-weight:700;color:var(--brown-dark);}
.emg-item .del-btn{position:static;}

/* MAP */
#map{height:300px;border-radius:10px;border:1px solid var(--border);}
.map-legend{display:flex;gap:0.8rem;flex-wrap:wrap;margin-top:0.5rem;font-size:0.73rem;}
.legend-item{display:flex;align-items:center;gap:0.3rem;}
.legend-dot{width:9px;height:9px;border-radius:50%;}
.gmap-links{display:flex;flex-direction:column;gap:0.45rem;margin-top:0.6rem;}
.gmap-btn{display:flex;align-items:center;gap:0.6rem;padding:0.45rem 0.75rem;border:1px solid var(--border);border-radius:8px;background:white;font-size:0.78rem;color:var(--brown-dark);text-decoration:none;}
.gmap-btn:hover{background:var(--cream2);}
.gmap-day{font-size:0.68rem;color:var(--gray);margin-left:auto;}
.route-item{display:flex;gap:0.5rem;align-items:center;padding:0.38rem 0;border-bottom:1px dashed #eee;flex-wrap:wrap;}
.route-item:last-child{border-bottom:none;}
.route-num{color:white;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-size:0.62rem;flex-shrink:0;}

/* MEMO */
.memo-area{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;padding:0.6rem;font-family:'Noto Sans JP',sans-serif;font-size:0.8rem;color:var(--text);background:white;resize:vertical;}

@media print{
  .nav-tabs,.top-bar,.add-btn,.del-btn,.edit-hint{display:none!important;}
  .section{display:block!important;}
  body{background:white;}
  .cover{background:#4a2800!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #map{height:220px;}
  .card,.hotel-card{break-inside:avoid;}
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">旅のしおり</div>
    <div class="lock-sub">パスワードを入力してください</div>
    <input class="lock-input" id="lock-input" type="password" placeholder="••••••••" maxlength="32"
      onkeydown="if(event.key==='Enter')unlock()">
    <button class="lock-btn" id="lock-btn" onclick="unlock()">開く</button>
    <div class="lock-error" id="lock-error"></div>
    <div class="lock-attempts" id="lock-attempts"></div>
  </div>
</div>

<div class="cover">
  <div class="cover-inner">
    <div class="cover-icon" id="cover-icon" contenteditable="false"></div>
    <h1 id="cover-title" contenteditable="false"></h1>
    <div class="cover-sub" id="cover-sub" contenteditable="false"></div>
    <div class="cover-meta" id="cover-meta"></div>
    <div style="position:absolute;top:0.7rem;right:0.8rem;z-index:2;">
      <button class="edit-toggle" id="et-cover" onclick="toggleEdit('cover')" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:white;font-size:0.72rem;padding:0.28rem 0.7rem;">✏️ 編集</button>
    </div>
  </div>
</div>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="showTab('schedule',this)">📋 日程</button>
  <button class="tab-btn" onclick="showTab('map',this)">🗺️ 地図</button>
  <button class="tab-btn" onclick="showTab('hotel',this)">🏨 宿泊</button>
  <button class="tab-btn" onclick="showTab('checklist',this)">☑️ 持ち物</button>
  <button class="tab-btn" onclick="showTab('info',this)">📞 連絡先</button>
  <button class="tab-btn" onclick="showTab('memo',this)">📝 メモ</button>
</div>

<!-- ===== SCHEDULE ===== -->
<div id="tab-schedule" class="section active">
  <div class="top-bar">
    <div class="top-bar-left">
      <button class="print-btn" onclick="window.print()">🖨️ 印刷</button>
      <button class="edit-toggle" id="et-schedule" onclick="toggleEdit('schedule')">✏️ 編集</button>
    </div>
  </div>
  <div class="edit-hint" id="eh-schedule">タイトル・時間・説明をタップして編集 ／ ＋で追加 ／ 🗑️で削除</div>
  <div id="schedule-body"></div>
</div>

<!-- ===== MAP ===== -->
<div id="tab-map" class="section">
  <div class="card">
    <div class="card-title">🗺️ 全体マップ・移動ルート</div>
    <div id="map"></div>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#7a4810"></div>1日目</div>
      <div class="legend-item"><div class="legend-dot" style="background:#b04010"></div>2日目</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4a7040"></div>3日目</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e07820"></div>宿泊先</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📍 Google Maps で開く</div>
    <div class="gmap-links" id="gmap-links"></div>
  </div>
  <div class="card">
    <div class="card-title">🚗 移動ルート概要</div>
    <div id="route-summary"></div>
  </div>
</div>

<!-- ===== HOTEL ===== -->
<div id="tab-hotel" class="section">
  <div class="top-bar">
    <button class="edit-toggle" id="et-hotel" onclick="toggleEdit('hotel')">✏️ 編集</button>
  </div>
  <div class="edit-hint" id="eh-hotel">各項目をタップして編集 ／ ＋で行を追加 ／ 🗑️で削除</div>
  <div id="hotel-body"></div>
</div>

<!-- ===== CHECKLIST ===== -->
<div id="tab-checklist" class="section">
  <div class="top-bar">
    <button class="edit-toggle" id="et-checklist" onclick="toggleEdit('checklist')">✏️ 編集</button>
  </div>
  <div class="edit-hint" id="eh-checklist">ラベルをタップして編集 ／ ＋でアイテム追加 ／ 🗑️で削除</div>
  <div class="card" id="checklist-card">
    <div class="card-title">☑️ 持ち物チェックリスト</div>
    <div id="checklist-body"></div>
    <button class="add-btn" id="add-group-btn" onclick="addCheckGroup()">＋ グループを追加</button>
  </div>
</div>

<!-- ===== INFO ===== -->
<div id="tab-info" class="section">
  <div class="top-bar">
    <button class="edit-toggle" id="et-info" onclick="toggleEdit('info')">✏️ 編集</button>
  </div>
  <div class="edit-hint" id="eh-info">各項目をタップして編集 ／ ＋で行を追加 ／ 🗑️で削除</div>
  <div id="info-body"></div>
</div>

<!-- ===== MEMO ===== -->
<div id="tab-memo" class="section">
  <div class="top-bar">
    <button class="edit-toggle" id="et-memo" onclick="toggleEdit('memo')">✏️ 編集</button>
  </div>
  <div class="edit-hint" id="eh-memo">メモ欄を自由に編集 ／ ＋でメモ欄を追加 ／ 🗑️で削除</div>
  <div id="memo-container">
    <div class="card memo-card" style="position:relative;">
      <div class="card-title" contenteditable="false">📝 旅メモ</div>
      <textarea class="memo-area" placeholder="自由にメモを入力してください..."></textarea>
      <button class="del-btn" onclick="delItem(this)" style="position:absolute;top:0.6rem;right:0.6rem;">🗑️</button>
    </div>
    <div class="card memo-card" style="position:relative;">
      <div class="card-title" contenteditable="false">🍽️ 食事メモ</div>
      <textarea class="memo-area" style="min-height:75px;" placeholder="行きたいお店・ランチ・ディナーなど..."></textarea>
      <button class="del-btn" onclick="delItem(this)" style="position:absolute;top:0.6rem;right:0.6rem;">🗑️</button>
    </div>
    <div class="card memo-card" style="position:relative;">
      <div class="card-title" contenteditable="false">🛍️ おみやげリスト</div>
      <textarea class="memo-area" style="min-height:75px;" placeholder="買いたいもの・渡す人など..."></textarea>
      <button class="del-btn" onclick="delItem(this)" style="position:absolute;top:0.6rem;right:0.6rem;">🗑️</button>
    </div>
  </div>
  <button class="add-btn" id="add-memo-btn" onclick="addMemoCard()">＋ メモ欄を追加</button>
</div>

<script src="data.js"></script>
<script>
// ===== AUTH =====
const PASS_HASH = 'b5322326e9fc899bcfc0cfac731f0b987a3805fcfcb77409562abd6f02ac89be';
const SALT = 'gotocoffee2025';
let attempts = 0, lockUntil = 0;

async function unlock() {
  const now = Date.now();
  if (now < lockUntil) {
    const s = Math.ceil((lockUntil - now) / 1000);
    document.getElementById('lock-error').textContent = `ロック中 — あと${s}秒`;
    return;
  }
  const pw = document.getElementById('lock-input').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + pw));
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hash === PASS_HASH) {
    document.getElementById('lock-screen').style.display = 'none';
    attempts = 0;
  } else {
    attempts++;
    if (attempts >= 5) {
      lockUntil = Date.now() + 60000;
      attempts = 0;
      document.getElementById('lock-error').textContent = 'パスワードが違います（1分間ロック）';
    } else {
      document.getElementById('lock-error').textContent = `パスワードが違います（残り${5 - attempts}回）`;
    }
  }
}

// ===== RENDER =====
function renderAll() {
  renderCover();
  renderSchedule();
  renderHotel();
  renderChecklist();
  renderInfo();
  renderMap();
}

function renderCover() {
  const d = TABINO_DATA.cover;
  document.getElementById('cover-icon').textContent = d.icon;
  document.getElementById('cover-title').textContent = d.title;
  document.getElementById('cover-sub').textContent = d.subtitle;
  const meta = document.getElementById('cover-meta');
  meta.innerHTML = d.meta.map(m => `<span contenteditable="false">${m}</span>`).join('');
}

function renderSchedule() {
  const body = document.getElementById('schedule-body');
  body.innerHTML = '';
  TABINO_DATA.schedule.days.forEach(day => {
    const badgeClass = day.badge === 'd1' ? '' : day.badge === 'd2' ? ' d2' : ' d3';
    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `<span class="day-badge${badgeClass}">${day.label}</span><div class="day-line"></div><span style="font-size:0.73rem;color:var(--gray);">${day.note}</span>`;
    body.appendChild(header);

    const card = document.createElement('div');
    card.className = 'card editing-active';
    card.id = day.cardId;

    const tl = document.createElement('div');
    tl.className = 'timeline';
    tl.id = day.tlId;

    day.items.forEach(item => {
      tl.appendChild(makeTlItem(item));
    });

    card.appendChild(tl);
    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.onclick = () => addTlItem(day.tlId);
    addBtn.textContent = '＋ 項目を追加';
    card.appendChild(addBtn);
    body.appendChild(card);
  });
}

function makeTlItem(item) {
  const div = document.createElement('div');
  div.className = 'tl-item';
  let html = `<div class="tl-dot${item.dot ? ' '+item.dot : ''}"></div>`;
  html += `<button class="del-btn" onclick="delItem(this)">🗑️</button>`;
  html += `<div class="tl-time" contenteditable="false">${item.time}</div>`;
  html += `<div class="tl-title" contenteditable="false">${item.title}</div>`;
  if (item.desc) html += `<div class="tl-desc" contenteditable="false">${item.desc}</div>`;
  if (item.transport) html += `<div class="transport" contenteditable="false">${item.transport}</div>`;
  if (item.note) html += `<div class="tl-note" contenteditable="false">${item.note}</div>`;
  if (item.info) html += `<div class="tl-info" contenteditable="false">${item.info}</div>`;
  div.innerHTML = html;
  return div;
}

function renderHotel() {
  const body = document.getElementById('hotel-body');
  body.innerHTML = '';

  TABINO_DATA.hotels.forEach(h => {

    card.className = 'hotel-card';

      <div class="hotel-header" style="${h.headerStyle}">

      </div>
      <div class="hotel-body">
        <div style="font-size:0.95rem;font-weight:700;margin-bottom:0.55rem;color:var(--brown-dark);" contenteditable="false">${h.name}</div>

          ${h.rows.map(r => `<div class="info-row"><span class="info-label" contenteditable="false">${r.label}</span><span class="info-val" contenteditable="false">${r.val}</span><button class="del-btn" onclick="delItem(this)" style="position:static;">🗑️</button></div>`).join('')}

  const p = TABINO_DATA.parking;

  pCard.style.cssText = 'border-left:3px solid var(--green);';
  pCard.id = 'parking-card';
  pCard.innerHTML = `
    <div class="card-title">🅿️ 3日目 予約済み駐車場</div>
    <div style="font-size:0.88rem;font-weight:700;margin-bottom:0.45rem;color:var(--brown-dark);" contenteditable="false">${p.name}</div>
    <div id="${p.rowsId}">
      ${p.rows.map(r => `<div class="info-row"><span class="info-label" contenteditable="false">${r.label}</span><span class="info-val" contenteditable="false">${r.val}</span><button class="del-btn" onclick="delItem(this)" style="position:static;">🗑️</button></div>`).join('')}
    </div>
    <div style="background:#fff5f0;border-left:3px solid var(--terra);padding:0.4rem 0.6rem;border-radius:0 4px 4px 0;margin-top:0.4rem;font-size:0.76rem;color:var(--terra);" contenteditable="false">${p.warning}</div>
    <button class="add-btn" onclick="addInfoRow('${p.rowsId}')">＋ 項目を追加</button>`;
  body.appendChild(pCard);
}

function renderChecklist() {
  const body = document.getElementById('checklist-body');
  body.innerHTML = '';
  TABINO_DATA.checklist.forEach(g => {
    const group = document.createElement('div');
    group.className = 'check-group';
    group.id = g.id;
    let html = `<div class="check-group-title">${g.title}<button class="del-btn" onclick="delItem(this)" style="position:static;margin-left:auto;">🗑️</button></div>`;
    g.items.forEach(item => {
      html += `<div class="check-item"><input type="checkbox" onchange="toggleCheck(this)"><label contenteditable="false">${item}</label><button class="del-btn" onclick="delItem(this)" style="position:static;">🗑️</button></div>`;
    });
    html += `<button class="add-btn" onclick="addCheckItem(this.parentElement)">＋ 追加</button>`;
    group.innerHTML = html;
    body.appendChild(group);
  });
}

      ${d.emergency.map(r => `<div class="emg-item"><div><div style="font-size:0.8rem;" contenteditable="false">${r.name}</div></div><div class="emg-val" contenteditable="false">${r.val}</div><button class="del-btn" onclick="delItem(this)" style="position:static;">🗑️</button></div>`).join('')}

      ${d.spots.map(r => `<div class="emg-item"><div><div style="font-size:0.8rem;" contenteditable="false">${r.name}</div><div class="emg-label-s" contenteditable="false">${r.sub}</div></div><div style="font-size:0.73rem;color:var(--brown);text-align:right;" contenteditable="false">${r.addr}</div><button class="del-btn" onclick="delItem(this)" style="position:static;">🗑️</button></div>`).join('')}

    <button class="add-btn" onclick="addEmgRow('info-spot-rows')">＋ 追加</button>`;

function renderMap() {
  const d = TABINO_DATA.map;

  const gmapLinks = document.getElementById('gmap-links');
  gmapLinks.innerHTML = d.gmapLinks.map(l =>
    `<a class="gmap-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.query)}" target="_blank"><span>${l.label}</span><span class="gmap-day">${l.day}</span></a>`
  ).join('');

  const routeSummary = document.getElementById('route-summary');
  routeSummary.innerHTML = d.routeSummary.map(r =>
    `<div class="route-item"><span class="route-num" style="background:${r.color};">${r.num}</span><span style="font-size:0.8rem;flex:1;">${r.text}</span><span class="transport" style="margin:0;">${r.transport}</span></div>`
  ).join('');
}

// ===== TAB =====
function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'map' && !window.mapInit) initMap();
}

// ===== EDIT MODE per tab =====
const editStates = {};
function toggleEdit(tab) {
  editStates[tab] = !editStates[tab];
  const on = editStates[tab];
  const btn = document.getElementById('et-' + tab);
  const hint = document.getElementById('eh-' + tab);
  btn.textContent = on ? '✅ 完了' : '✏️ 編集';
  btn.classList.toggle('on', on);
  if (hint) hint.classList.toggle('show', on);

  if (tab === 'cover') {
    document.querySelectorAll('.cover [contenteditable]').forEach(el => {
      el.contentEditable = on ? 'true' : 'false';
    });
    return;
  }

  const section = document.getElementById('tab-' + tab);
  section.querySelectorAll('[contenteditable]').forEach(el => {
    el.contentEditable = on ? 'true' : 'false';
  });
  section.querySelectorAll('.del-btn').forEach(b => b.style.display = on ? 'block' : 'none');
  section.querySelectorAll('.add-btn').forEach(b => b.style.display = on ? 'flex' : 'none');
  section.querySelectorAll('.timeline').forEach(tl => tl.classList.toggle('editing', on));
  if (tab === 'memo') {
    section.querySelectorAll('.card-title').forEach(el => el.contentEditable = on ? 'true' : 'false');
  }
}

// ===== DELETE =====
function delItem(btn) {
  const target = btn.closest('.tl-item, .info-row, .check-item, .check-group, .emg-item, .memo-card');
  if (target && confirm('削除しますか？')) target.remove();
}

// ===== ADD TIMELINE ITEM =====
function addTlItem(tlId) {
  const tl = document.getElementById(tlId);
  const on = editStates['schedule'];
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.innerHTML = `<div class="tl-dot"></div><button class="del-btn" onclick="delItem(this)" style="display:${on?'block':'none'}">🗑️</button><div class="tl-time" contenteditable="${on}">時間</div><div class="tl-title" contenteditable="${on}">新しい項目</div><div class="tl-desc" contenteditable="${on}">説明を入力</div>`;
  tl.appendChild(item);
  item.querySelector('.tl-title').focus();
}

// ===== ADD INFO ROW =====
function addInfoRow(containerId) {
  const c = document.getElementById(containerId);
  const tab = c.closest('.section').id.replace('tab-','');
  const on = editStates[tab];
  const row = document.createElement('div');
  row.className = 'info-row';
  row.innerHTML = `<span class="info-label" contenteditable="${on}">項目</span><span class="info-val" contenteditable="${on}">内容</span><button class="del-btn" onclick="delItem(this)" style="position:static;display:${on?'block':'none'}">🗑️</button>`;
  c.appendChild(row);
  row.querySelector('.info-label').focus();
}

// ===== ADD CHECK ITEM =====
function addCheckItem(group) {
  const on = editStates['checklist'];
  const addBtn = group.querySelector('.add-btn');
  const item = document.createElement('div');
  item.className = 'check-item';
  item.innerHTML = `<input type="checkbox" onchange="toggleCheck(this)"><label contenteditable="${on}">新しい項目</label><button class="del-btn" onclick="delItem(this)" style="position:static;display:${on?'block':'none'}">🗑️</button>`;
  group.insertBefore(item, addBtn);
  item.querySelector('label').focus();
}

// ===== ADD CHECK GROUP =====
function addCheckGroup() {
  const on = editStates['checklist'];
  const container = document.getElementById('checklist-body');
  const addGroupBtn = document.getElementById('add-group-btn');
  const group = document.createElement('div');
  group.className = 'check-group';
  group.innerHTML = `<div class="check-group-title" contenteditable="${on}">新しいグループ<button class="del-btn" onclick="delItem(this)" style="position:static;margin-left:auto;display:${on?'block':'none'}">🗑️</button></div><button class="add-btn" onclick="addCheckItem(this.parentElement)" style="display:${on?'flex':'none'}">＋ 追加</button>`;
  container.insertBefore(group, addGroupBtn);
  group.querySelector('.check-group-title').focus();
}

// ===== ADD EMG ROW =====
function addEmgRow(containerId) {
  const c = document.getElementById(containerId);
  const on = editStates['info'];
  const row = document.createElement('div');
  row.className = 'emg-item';
  row.innerHTML = `<div><div style="font-size:0.8rem;" contenteditable="${on}">名前</div><div class="emg-label-s" contenteditable="${on}">メモ</div></div><div class="emg-val" contenteditable="${on}">値</div><button class="del-btn" onclick="delItem(this)" style="position:static;display:${on?'block':'none'}">🗑️</button>`;
  c.appendChild(row);
  row.querySelector('[contenteditable]').focus();
}

// ===== ADD MEMO CARD =====
function addMemoCard() {
  const on = editStates['memo'];
  const container = document.getElementById('memo-container');
  const card = document.createElement('div');
  card.className = 'card memo-card';
  card.style.position = 'relative';
  card.innerHTML = `<div class="card-title" contenteditable="${on}">📝 新しいメモ</div><textarea class="memo-area" placeholder="メモを入力..."></textarea><button class="del-btn" onclick="delItem(this)" style="position:absolute;top:0.6rem;right:0.6rem;display:${on?'block':'none'}">🗑️</button>`;
  container.appendChild(card);
}

// ===== CHECKBOX =====
function toggleCheck(cb) {
  cb.closest('.check-item').classList.toggle('checked', cb.checked);
}

// ===== MAP =====
function initMap() {
  window.mapInit = true;
  const d = TABINO_DATA.map;
  const map = L.map('map').setView(d.center, d.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap contributors'}).addTo(map);
  d.spots.forEach(s => {
    const icon = L.divIcon({html:`<div style="width:13px;height:13px;border-radius:50%;background:${s.color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3)"></div>`,className:'',iconSize:[13,13],iconAnchor:[6,6]});
    L.marker([s.lat,s.lng],{icon}).addTo(map).bindPopup(`<strong>${s.label}</strong><br><small>${s.day}</small>`);
  });
  d.routes.forEach(r => {
    L.polyline(r.points, {color:r.color,weight:r.weight,dashArray:'6,4',opacity:0.7}).addTo(map);
  });
}

// ===== INIT =====
renderAll();
</script>
